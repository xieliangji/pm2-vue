<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d2e1d4"><title>pélo. — 一路向海 · 海岸骑行 02</title><meta name="description" content="连续海岸、沙滩、岩岸与拍岸浪花。陪一只鹈鹕沿海骑行。"><link rel="icon" href="data:,"></head>
<body style="margin:0;background:#d2e1d4;color:#28584f;font:15px sans-serif"><main id="boot" style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px;box-sizing:border-box"><strong style="font:64px Georgia">pélo.</strong><p id="status" role="status" style="font-size:12px;letter-spacing:2px">正在展开海岸</p><button hidden id="retry" onclick="location.reload()" style="padding:12px;border:1px solid #28584f;border-radius:24px;background:transparent;color:inherit">重新加载</button></main><noscript>请开启 JavaScript 以体验 3D 海岸。</noscript>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if(!globalThis.DecompressionStream || !crypto.subtle) throw new Error('请通过 HTTPS 使用支持 WebGL 2 的较新浏览器。');
  const sha=async text=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))),n=>n.toString(16).padStart(2,'0')).join('');
  const get=async url=>{let last;for(let i=0;i<2;i++){try{const response=await fetch(url,{credentials:'omit',signal:AbortSignal.timeout(18000)});if(!response.ok)throw new Error('资源加载失败 '+response.status);return await response.text();}catch(e){last=e;}}throw last;};
  const baseHash='109fa227fac18822292c24600f2869baaffa6676d1f299e31aaafb93a95970ed';
  const baseTask=(async()=>{for(const url of ['index.html','https://raw.githubusercontent.com/xieliangji/pm2-vue/ab72d5055141a87035bad1698f200446ea838b7f/pelo-coast/index.html']){try{const text=await get(url);if(await sha(text)===baseHash)return text;}catch(e){}}throw new Error('基础资源未能完整加载，请重试。');})();
  let loaded=0;
  const partTask=Promise.all(Array.from({length:9},(_,i)=>get('coast-v2-part-'+String(i+1).padStart(2,'0')+'.txt').then(text=>{status.textContent='正在展开海岸 · '+(++loaded)+'/9';return text.trim();})));
  const [base,parts]=await Promise.all([baseTask,partTask]);
  const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  const delta=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  const chars=Array.from(base);
  const source=delta.map(item=>Array.isArray(item)?chars.slice(item[0],item[1]).join(''):item).join('');
  if(await sha(source)!=='748a6626edd6995e45a9dda4f120b28a9eda5c60384f8279b9ce532edf5fdccd')throw new Error('资源完整性校验失败，请重试。');
  document.open();document.write(source);document.close();
 }catch(error){status.textContent='海岸未能展开：'+error.message;document.getElementById('retry').hidden=false;console.error(error);}
})();
</script></body></html>
